name: searxng
services:
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: always
    ports:
      - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-8888}:${SEARXNG_PORT:-8888}
    env_file: ./.env
    # Container DNS resolves hosts to Clash/mihomo fake-IPs (198.18.x.x).
    # Verified 2026-09-23: direct connections to those fake IPs work (Docker
    # Desktop routes them through the Windows TUN), so no proxy is configured by
    # default. The previous hardcoded default http://host.docker.internal:7897 is
    # no longer listening and made every engine fail with "HTTP connection error".
    # To route SearXNG through a proxy instead, add to .env (loaded via env_file):
    #   HTTP_PROXY=http://host.docker.internal:<port>
    #   HTTPS_PROXY=http://host.docker.internal:<port>
    #   NO_PROXY=localhost,127.0.0.1,::1,searxng-core,searxng-valkey
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:Z
      - core-data:/var/cache/searxng/
  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - valkey-data:/data/
volumes:
  core-data:
  valkey-data:
